<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dine & Seek | Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <div class="login-brand">
                <a href="index.html">
                    Dine & Seek
                </a>
            </div>

            <div class="login-card">

                <div class="login-header">

                    <p class="section-label">
                        ADMIN AREA
                    </p>

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Sign in to manage the Dine & Seek
                        restaurant database.
                    </p>

                </div>

                <form id="adminLoginForm">

                    <div class="filter-group">

                        <label for="adminUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="adminUsername"
                            name="username"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                    <div class="filter-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="hero-button login-button"
                    >
                        Login
                    </button>

                    <p
                        id="loginError"
                        class="login-error"
                        style="display: none;"
                    >
                        Invalid username or password.
                    </p>

                </form>

                <!-- Demo Account -->

                <div class="demo-login">

                    <button
                        type="button"
                        id="demoToggle"
                        class="demo-toggle"
                    >
                        Demo Account Login Details
                    </button>

                    <div
                        id="demoDetails"
                        class="demo-details"
                        style="display: none;"
                    >

                        <p>
                            Use the demo account below to access
                            the Admin Dashboard.
                        </p>

                        <div class="demo-credentials">

                            <p>
                                <strong>Username:</strong>
                                <span>admin</span>
                            </p>

                            <p>
                                <strong>Password:</strong>
                                <span>admin123</span>
                            </p>

                        </div>

                        <button
                            type="button"
                            id="useDemoAccount"
                            class="demo-button"
                        >
                            Use Demo Account
                        </button>

                    </div>

                </div>

                <div class="login-back">

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </main>
    <script src="admin-login.js"></script>

</body>

</html>
